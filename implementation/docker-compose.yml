services:
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets:
        - guardrails_token
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Allow requests proxied from the frontend service host ("backend").
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,::1,backend}
      # Token for Guardrails Hub remote inference. Read from .env in this directory.
      GUARDRAILS_TOKEN: ${GUARDRAILS_TOKEN:-}
    volumes:
      - .:/app
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    restart: unless-stopped
    build: frontend
    working_dir: /app
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  frontend_node_modules:

secrets:
  guardrails_token:
    environment: GUARDRAILS_TOKEN

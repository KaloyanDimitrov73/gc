template: |
  You are a routing component for a question-answering system about software
  architecture research papers. You decide for a curated knowledge graph of research in SOFTWARE ARCHITECTURE.
  
  Given the current user question and the prior
  conversation history, output EXACTLY ONE of these three words and nothing
  else -- no punctuation, no explanation, no markdown:

  general | chat_history | retrieval

  - general: The question is chit-chat, a greeting, a meta question about the
    assistant itself, or clearly outside the scope of software architecture
    research. Answerable directly, no grounding needed.

  - chat_history: The question is a follow-up that refers to information
    already fully present in the conversation history (e.g. sort, filter,
    count, or re-summarize a list of papers/facts a previous assistant turn
    already stated). No new facts beyond the history are needed.

  - retrieval: The question needs facts NOT (fully) contained in the
    conversation history, even if it references entities from a previous turn
    (e.g. "these papers"). New information must be fetched from the knowledge
    base.

  When in doubt between chat_history and retrieval, output retrieval: it is
  safer to fetch fresh grounding than to answer from incomplete history.

  ## Examples

  History: (no prior conversation)
  Question: "Hi!"
  Output: general

  History: (no prior conversation)
  Question: "Hey, what's up?"
  Output: general
 
  History: (no prior conversation)
  Question: "What kind of questions can I ask you?"
  Output: general

  History:
  User: Which papers have been published by the author Johanna Keller?
  Assistant: The publications by Johanna Keller are: 1. Modeling Microservice Boundaries with Domain-Driven Heuristics (2017) 2. A Lightweight Framework for API Gateway Selection (2022).
  Question: "Which of these two was published first?"
  Output: chat_history

  History:
  User: Which papers investigate technical debt in monolithic systems, and what conference were they published at?
  Assistant: Three papers investigate technical debt in monolithic systems: [...lists papers with conference names...]
  Question: "Sort these by conference name alphabetically."
  Output: chat_history

  History:
  User: Which papers identify generalizability as a threat to validity?
  Assistant: Three papers identify generalizability as a threat to validity: [...lists papers, no evaluation methods mentioned...]
  Question: "How many of these papers use interviews as an evaluation method?"
  Output: retrieval
 
  History:
  User: Which papers investigate microservice decomposition strategies?
  Assistant: The paper "Heuristic-Driven Decomposition of Legacy Monoliths into Microservices" investigates microservice decomposition strategies [...no publication venue mentioned...]
  Question: "Which of these were published at ICSE?"
  Output: retrieval

  ## Task

  History:
  {history}

  Question: "{question}"
  Output:
input_variables:
  - question
  - history
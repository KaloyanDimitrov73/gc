[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HubLink-Backend"
version = "0.1.0"
license = { text = "MIT" }
dependencies = [
  "chroma-hnswlib==0.7.6",
  "chromadb==0.6.3",
  "chromadb-ops==0.1.3",
  "posthog==5.3.0", # chromadb 0.6.3 compatibility (posthog<6 API)
  "cryptography==43.0.3",
  "httpcore==1.0.7",
  "httplib2==0.22.0",
  "importlib_metadata==8.5.0",
  "importlib_resources==6.5.2",
  "jiter==0.8.2",
  "joblib==1.4.2",
  "langchain==0.3.19",
  "langchain-chroma==0.2.2",
  "langchain-community==0.3.18",
  "langchain-core==0.3.37",
  "langchain-ollama==0.2.3",
  "langchain-openai==0.3.6",
  "langchain-text-splitters==0.3.6",
  "langsmith==0.3.8",
  "multidict==6.1.0",
  "nest-asyncio==1.6.0",
  "numpy==1.26.4",
  "orkg==0.21.3",
  "packaging==24.2",
  "pandas==2.2.3",
  "pylatexenc==2.10",
  "pydantic==2.10.6",
  "pydantic_core==2.27.2",
  "rdflib==7.1.3",
  "scikit-learn==1.6.1",
  "tqdm==4.67.1",
  "urllib3==2.3.0",
  "weave>=0.51.37",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
]
# Only install graphrag for Python versions below 3.13
graphrag = [
  "graphrag==1.2.0; python_version < '3.13'"
]
# Only install codecarbon when NOT installing graphrag
codecarbon = [
  "codecarbon~=2.8.3",
]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgc-app-backend"
version = "0.1.0"

license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.10.6",
  "pydantic-settings==2.6.0",
  "python-dotenv>=1.0.0",
  "guardrails-ai==0.9.2",
  "sqlalchemy==2.0.48",
  "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-v -s"
asyncio_mode = "auto"
markers = [
  "unit: fast deterministic tests with no external dependencies",
  "integration: tests that require external services, credentials, or heavy runtime dependencies",
]

[project.scripts]
hublink-backend = "backend.app.main:main"
